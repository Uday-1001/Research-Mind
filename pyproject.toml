[project]
name = "multi-agent-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Uday", email = "udayrazi123@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9.0",
    "beautifulsoup4>=4.12.0",
    "html5lib>=1.1",
    "langchain>=0.2.0",
    "langchain-community>=0.2.0",
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "lxml>=5.0.0",
    "openai>=1.30.0",
    "orjson>=3.9.0",
    "pandas>=2.0.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "streamlit>=1.61.1",
    "tavily-python>=0.3.0",
    "tenacity>=8.2.0",
    "tiktoken>=0.6.0",
]

[project.scripts]
multi-agent-assistant = "multi_agent_assistant:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
